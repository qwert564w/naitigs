# Done to increase the memory available to gradle.
# Fix for JDK 21 Unix domain socket bug on Windows (PipeImpl fails with long TEMP paths)
org.gradle.jvmargs=-Xmx1G -Djava.net.preferIPv4Stack=true

# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.9
loader_version=0.16.9

# Mod Properties
mod_version=1.0.0
maven_group=night
archives_base_name=Nightix

# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.110.5+1.21.4

# Локальные runtime-либы (плоские jar в libs/)
media_player_info_version=0.1.0
kotlin_version=1.9.20
kotlinx_serialization_version=1.6.3

# true = media-player-info + kotlin внутри mod jar (jar-in-jar через Loom include)
# false = либы отдельно (compileOnly + modLocalRuntime, копируются в mods/)
bundle_libs_in_jar=true
