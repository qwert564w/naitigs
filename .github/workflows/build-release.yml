name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: List build files
      run: ls -la build/libs/
      
    - name: Rename JAR
      run: |
        JAR_FILE=$(ls build/libs/*.jar | grep -v sources | head -n 1)
        if [ -n "$JAR_FILE" ]; then
          mv "$JAR_FILE" "build/libs/Naitigs-1.21.11.jar"
        fi
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: Naitigs Client v1.0.0 - Minecraft 1.21.11
        body: |
          ## Changelog
          
          - ✅ Добавлен модуль AntiDarkness
          - ✅ Убирает эффект тьмы от Вардена
          - ✅ Убирает визуальный огонь при горении
          - ✅ Совместимость с Fabric 1.21.11
          
          ## Установка
          
          1. Скачайте .jar файл
          2. Установите Fabric Loader для 1.21.11
          3. Закиньте файл в папку `.minecraft/mods`
          4. Запустите игру
        files: build/libs/Naitigs-1.21.11.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
