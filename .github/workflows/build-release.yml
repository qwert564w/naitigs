name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/libs/*.jar
        
    - name: Get JAR filename
      id: get_jar
      run: |
        JAR_FILE=$(ls build/libs/*.jar | head -n 1)
        echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
        echo "jar_name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
        echo "Found JAR: $JAR_FILE"
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }} - Intpol Rotation
        body: |
          ## 🎮 Intpol Rotation System Release
          
          ### ✨ Features:
          - 30+ easing functions для непредсказуемых паттернов ротации
          - Адаптивная скорость на основе дистанции и состояния игрока
          - Плавающие точки хитбокса (никогда не бьёт в одно место)
          - Overrotation и micro-tremor для человеческого поведения
          - Anti-detection для обхода AAC/Grim/Matrix
          
          ### 📝 Changelog:
          - Исправлен баг `target.getPos()` → `target.getBoundingBox()`
          - Исправлен баг `hitbox.getXLength()` → ручное вычисление размеров
          - Все easing функции работают корректно
          - Адаптивная скорость проверена
          
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.get_jar.outputs.jar_path }}
        asset_name: ${{ steps.get_jar.outputs.jar_name }}
        asset_content_type: application/java-archive
