name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: List build files
      run: ls -la build/libs/
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-jars
        path: build/libs/*.jar
        retention-days: 7
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: night-tut
        name: night tut
        body: |
          ## 🎮 Intpol Rotation System Release
          
          ### ✨ Features:
          - 30+ easing functions для непредсказуемых паттернов ротации
          - Адаптивная скорость на основе дистанции и состояния игрока
          - Плавающие точки хитбокса (никогда не бьёт в одно место)
          - Overrotation и micro-tremor для человеческого поведения
          - Anti-detection для обхода AAC/Grim/Matrix
          
          ### 📝 Changelog:
          - Исправлен баг `target.getPos()` → `target.getBoundingBox()`
          - Исправлен баг `hitbox.getXLength()` → ручное вычисление размеров
          - Все easing функции работают корректно
          - Адаптивная скорость проверена
        files: |
          build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
